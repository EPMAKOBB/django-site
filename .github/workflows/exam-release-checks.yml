name: Exam season checks

on:
  push:
    branches: ["release/exam-seasons-2027"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  annual-exam-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: examdev
          POSTGRES_PASSWORD: ci-only-exam-password
          POSTGRES_DB: exam_year_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U examdev -d exam_year_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: fractalschool.postgres_test_settings
      EXAM_TEST_PORT: "5432"
      EXAM_TEST_PASSWORD: ci-only-exam-password
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test apps.recsys.tests --noinput
